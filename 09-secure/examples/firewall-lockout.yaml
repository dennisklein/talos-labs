# A rule that looks right: apid on the worker only from the control plane node (10.5.9.2), the
# endpoint of talosctl. But talosctl cannot connect to the worker directly from the host
# (10.5.9.1) any more. Apply it only in try mode.
apiVersion: v1alpha1
kind: NetworkDefaultActionConfig
ingress: block
---
apiVersion: v1alpha1
kind: NetworkRuleConfig
name: apid-ingress
portSelector:
  ports: [50000]
  protocol: tcp
ingress:
  - subnet: 10.5.9.2/32
